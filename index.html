<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dakno AI — 12 Experts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090f;
      --surface: #0c0f1a;
      --panel: #10141f;
      --card: #141824;
      --border: #1c2236;
      --accent: #4f8aff;
      --accent2: #7ba8ff;
      --glow: #4f8aff28;
      --text: #dde4f0;
      --muted: #4a5470;
      --muted2: #6b7894;
      --danger: #ff4f6a;
      --success: #2edd8c;
      --warn: #f5a623;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Sarabun', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-weight: 300;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 10% -10%, #1a2a6022 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 110%, #1a1a4015 0%, transparent 55%),
        radial-gradient(ellipse 30% 30% at 50% 50%, #0d1428 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ====== HEADER (scrollable) ====== */
    header {
      position: relative;
      z-index: 20;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(7, 9, 15, 0.92);
      backdrop-filter: blur(24px);
      flex-shrink: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      flex-wrap: nowrap;
    }

    header::-webkit-scrollbar { display: none; }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .logo-mark {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, #2451d4, #4f8aff);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      box-shadow: 0 0 18px #4f8aff44;
      position: relative; overflow: hidden;
      flex-shrink: 0;
    }

    .logo-mark::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.18) 0%, transparent 60%);
    }

    .logo-name {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.3px;
      line-height: 1;
      color: white;
    }

    .logo-tag {
      font-size: 9px;
      color: var(--muted2);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }

    .key-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    #api-key {
      width: 130px;
      padding: 7px 10px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 9px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      transition: border-color .2s, box-shadow .2s;
    }

    #api-key:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--glow);
    }

    .hbtn {
      padding: 7px 11px;
      border-radius: 9px;
      border: 1px solid transparent;
      font-size: 11px;
      font-family: 'Sarabun', sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .hbtn.sec { background: var(--card); border-color: var(--border); color: var(--muted2); }
    .hbtn.sec:hover { border-color: var(--accent); color: var(--accent2); }
    .hbtn.pri { background: var(--accent); color: white; box-shadow: 0 2px 14px #4f8aff44; }
    .hbtn.pri:hover { background: #3a72f0; }
    .hbtn:disabled { opacity: .4; cursor: default; }

    /* ====== EXPERT STRIP ====== */
    .expert-strip {
      position: relative;
      z-index: 15;
      display: flex;
      gap: 6px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      background: var(--surface);
      flex-shrink: 0;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .expert-strip::-webkit-scrollbar { display: none; }

    .expert-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 100px;
      border: 1px solid;
      font-size: 10.5px;
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
      cursor: default;
      transition: all .2s;
      opacity: 0.5;
    }

    .expert-badge.active { opacity: 1; }
    .expert-badge.pulse { animation: badgepulse .5s ease; }

    @keyframes badgepulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .badge-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .mode-toggle {
      margin-left: auto;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .mode-pill {
      padding: 4px 9px;
      border-radius: 100px;
      border: 1px solid var(--border);
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted2);
      cursor: pointer;
      transition: all .15s;
      background: transparent;
      touch-action: manipulation;
    }

    .mode-pill:hover { border-color: var(--accent); color: var(--accent2); }
    .mode-pill.on { background: var(--accent); border-color: var(--accent); color: white; }

    #mode-manual {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted2);
      border-radius: 8px;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      padding: 4px 6px;
      cursor: pointer;
      outline: none;
    }

    /* ====== CHAT WINDOW ====== */
    #chat-window {
      position: relative;
      z-index: 1;
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    #chat-window::-webkit-scrollbar { width: 3px; }
    #chat-window::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ====== WELCOME ====== */
    #welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 22px;
      text-align: center;
      animation: fadeUp .5s ease;
    }

    .w-icon {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, #2451d4, #4f8aff);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      box-shadow: 0 0 40px #4f8aff44;
      animation: glow 3s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 28px #4f8aff30; }
      50% { box-shadow: 0 0 52px #4f8aff60; }
    }

    #welcome h2 { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; }
    #welcome p { color: var(--muted2); font-size: 12.5px; max-width: 280px; line-height: 1.7; }

    .experts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 7px;
      width: 100%;
      max-width: 380px;
    }

    .expert-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 10px;
      cursor: pointer;
      text-align: left;
      transition: all .2s;
      display: flex;
      flex-direction: column;
      gap: 5px;
      touch-action: manipulation;
    }

    .expert-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.3); }
    .expert-card .ec-icon { font-size: 17px; }
    .expert-card .ec-name { font-size: 11px; font-weight: 600; color: var(--text); }
    .expert-card .ec-desc { font-size: 10px; color: var(--muted2); line-height: 1.5; }

    /* ====== MESSAGES ====== */
    .msg-row {
      display: flex;
      gap: 9px;
      align-items: flex-end;
      animation: fadeUp .22s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { flex-direction: row-reverse; }

    .av {
      width: 28px; height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
    }

    .av.ai {
      background: linear-gradient(135deg, #2451d4, #4f8aff);
      box-shadow: 0 0 10px #4f8aff44;
      color: white;
    }

    .av.user { background: var(--card); border: 1px solid var(--border); color: var(--muted2); }

    .bubble {
      padding: 11px 15px;
      border-radius: 17px;
      max-width: 84%;
      font-size: 13.5px;
      line-height: 1.75;
      word-wrap: break-word;
      white-space: pre-wrap;
      font-weight: 300;
    }

    .bubble.user {
      background: linear-gradient(135deg, #1d42c4, #2d55e8);
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 14px #2563eb44;
    }

    .bubble.ai {
      background: var(--card);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
      position: relative;
    }

    .bubble-expert {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 9.5px;
      font-family: 'JetBrains Mono', monospace;
      padding: 2px 7px;
      border-radius: 100px;
      border: 1px solid;
      margin-bottom: 8px;
    }

    .bubble.ai a { color: var(--accent2); text-decoration: none; border-bottom: 1px solid #7ba8ff44; }
    .bubble.ai code { background: #1a2040; padding: 1px 6px; border-radius: 5px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; }
    .bubble.ai pre { background: #0f1525; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin: 8px 0; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; line-height: 1.6; }

    .typing-wrap {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 4px;
    }

    .typing-wrap span {
      width: 5px; height: 5px;
      background: var(--accent);
      border-radius: 50%;
      animation: tdot 1.2s ease-in-out infinite;
      opacity: .5;
    }

    .typing-wrap span:nth-child(2) { animation-delay: .2s; }
    .typing-wrap span:nth-child(3) { animation-delay: .4s; }

    @keyframes tdot {
      0%,80%,100% { transform: translateY(0); opacity: .4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    .routing-label {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted2);
      padding: 0 4px;
      animation: blink 1.2s infinite;
    }

    @keyframes blink { 0%,100% { opacity:.4; } 50% { opacity:1; } }

    /* Status bar */
    #status-bar {
      position: relative; z-index: 10;
      font-size: 10.5px;
      font-family: 'JetBrains Mono', monospace;
      padding: 4px 18px;
      min-height: 22px;
      flex-shrink: 0;
      transition: color .3s;
    }

    /* Input area */
    .input-area {
      position: relative; z-index: 10;
      padding: 10px 14px 14px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      background: rgba(7,9,15,.97);
      backdrop-filter: blur(20px);
    }

    .input-wrap { flex: 1; }

    #user-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 13px;
      resize: none;
      outline: none;
      font-size: 13.5px;
      font-family: 'Sarabun', sans-serif;
      font-weight: 300;
      min-height: 44px;
      max-height: 110px;
      overflow-y: auto;
      line-height: 1.5;
      transition: border-color .2s, box-shadow .2s;
    }

    #user-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
    #user-input::placeholder { color: var(--muted); }

    .send-btn {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #1d42c4, #4f8aff);
      border-radius: 13px;
      border: none;
      color: white;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
      box-shadow: 0 2px 14px #4f8aff44;
      touch-action: manipulation;
    }

    .send-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 22px #4f8aff66; }
    .send-btn:active:not(:disabled) { transform: scale(.95); }
    .send-btn:disabled { opacity: .3; cursor: default; }

    .char-ct {
      font-size: 9.5px;
      color: var(--muted);
      text-align: right;
      padding: 3px 3px 0;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ====== MOBILE RESPONSIVE ====== */
    @media (max-width: 600px) {
      header { padding: 8px 10px; gap: 6px; }
      .logo-wrap { gap: 6px; }
      .logo-mark { width: 28px; height: 28px; font-size: 12px; border-radius: 8px; }
      .logo-name { font-size: 14px; }
      .logo-tag { font-size: 7px; }
      #api-key { width: 80px; font-size: 10px; padding: 5px 6px; }
      .hbtn { padding: 5px 7px; font-size: 10px; }
      .expert-strip { padding: 6px 8px; gap: 4px; }
      .expert-badge { font-size: 9px; padding: 3px 6px; gap: 3px; }
      .badge-dot { width: 4px; height: 4px; }
      .mode-pill { padding: 2px 5px; font-size: 8px; }
      #mode-manual { font-size: 8px; padding: 2px 4px; border-radius: 6px; }
      #chat-window { padding: 10px 8px; gap: 10px; }
      .bubble { font-size: 12px; padding: 8px 10px; }
      .av { width: 24px; height: 24px; font-size: 10px; }
      .input-area { padding: 6px 8px 10px; gap: 6px; }
      #user-input { font-size: 12px; padding: 8px 10px; min-height: 36px; border-radius: 10px; }
      .send-btn { width: 38px; height: 38px; border-radius: 10px; }
      .send-btn svg { width: 14px; height: 14px; }
      .char-ct { font-size: 8px; }
      #welcome h2 { font-size: 16px; }
      #welcome p { font-size: 11px; max-width: 240px; }
      .experts-grid { grid-template-columns: 1fr 1fr; gap: 5px; max-width: 280px; }
      .expert-card { padding: 8px 6px; }
      .expert-card .ec-icon { font-size: 14px; }
      .expert-card .ec-name { font-size: 10px; }
      .expert-card .ec-desc { font-size: 9px; }
      #status-bar { font-size: 9px; padding: 2px 10px; min-height: 18px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-wrap">
      <div class="logo-mark">✦</div>
      <div>
        <div class="logo-name">Dakno AI</div>
        <div class="logo-tag">12 Experts · Groq</div>
      </div>
    </div>
    <div class="key-wrap">
      <input type="password" id="api-key" placeholder="Groq API Key" autocomplete="off">
      <button class="hbtn sec" onclick="saveKey()">บันทึก</button>
      <button class="hbtn pri" id="btn-test">ทดสอบ</button>
    </div>
  </header>

  <!-- Expert Strip (generated by JS) -->
  <div class="expert-strip" id="expert-strip"></div>

  <div id="chat-window">
    <div id="welcome">
      <div class="w-icon">✦</div>
      <div>
        <h2>Dakno Multi‑Expert</h2>

      </div>
      <div class="experts-grid" id="experts-grid"></div>
    </div>
  </div>

  <div id="status-bar" class="info"></div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea id="user-input" placeholder="พิมพ์ข้อความ... (Enter ส่ง, Shift+Enter ขึ้นบรรทัดใหม่)" rows="1" inputmode="text"></textarea>
      <div class="char-ct" id="char-ct">0 / 2000</div>
    </div>
    <button class="send-btn" id="send-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>

    </button>
  </div>

      {

        model: 'llama-3.2-11b-vision-preview',
        label: 'Vision',
        icon: '🖼️',
        color: '#fb923c',
        sys: 'คุณสามารถอธิบายภาพที่ผู้ใช้ส่งมา (ผ่าน URL) ได้อย่างละเอียด ตอบเป็นภาษาไทย'
      },
      {
        id: 'creative',
        model: 'llama-3.3-70b-versatile',
        label: 'Creative',
        icon: '✍️',
        color: '#e879f9',
        sys: 'คุณคือนักเขียนมืออาชีพ เขียนเรื่องสั้น นิยาย บทกวี คำโฆษณา ใช้ภาษาไทยสละสลวย สร้างสรรค์'
      },
      {
        id: 'thai',
        model: 'llama-3.3-70b-versatile',
        label: 'Thai Master',
        icon: '🇹🇭',
        color: '#34d399',
        sys: 'คุณคือผู้เชี่ยวชาญภาษาไทย ตอบเป็นภาษาไทยเท่านั้น ใช้สำนวนถูกต้อง สุภาพ และลึกซึ้ง'
      }
    ];

    let currentExpert = 'general';
let currentMode = 'auto'; // 'auto' or 'manual'
let apiKey = localStorage.getItem('dakno_groq_key') || '';
const MAX_CHARS = 2000;

// ========== BUILD UI DYNAMICALLY ==========
function buildExpertUI() {
  const strip = document.getElementById('expert-strip');
  const grid = document.getElementById('experts-grid');
  strip.innerHTML = '';
  grid.innerHTML = '';

  EXPERTS.forEach(ex => {
    // Expert badge in strip
    const badge = document.createElement('div');
    badge.className = 'expert-badge';
    badge.dataset.id = ex.id;
    badge.style.color = ex.color;
    badge.style.borderColor = ex.color + '44';
    badge.innerHTML = `<div class="badge-dot" style="background:${ex.color}"></div>${ex.label}`;
    badge.onclick = () => setManual(ex.id);
    strip.appendChild(badge);

    // Welcome card in grid
    const card = document.createElement('div');
    card.className = 'expert-card';
    card.style.borderLeft = `2px solid ${ex.color}`;
    card.innerHTML = `<span class="ec-icon">${ex.icon}</span>
                      <span class="ec-name">${ex.label}</span>
                      <span class="ec-desc">${ex.model.split('-')[0]}</span>`;
    card.onclick = () => hint(`(${ex.label}) ช่วยอธิบายเกี่ยวกับ...`);
    grid.appendChild(card);
  });

  // Add mode toggle at end of strip
  const toggle = document.createElement('div');
  toggle.className = 'mode-toggle';
  toggle.innerHTML = `
    <button class="mode-pill on" id="mode-auto">AUTO</button>
    <select id="mode-manual">
      <option value="">เลือกเอง</option>
      ${EXPERTS.map(e => `<option value="${e.id}">${e.label}</option>`).join('')}
    </select>
  `;
  strip.appendChild(toggle);

  // Attach event listeners for mode controls
  document.getElementById('mode-auto').addEventListener('click', () => setMode('auto'));
  document.getElementById('mode-manual').addEventListener('change', function() {
    setManual(this.value);
  });
}

buildExpertUI();

// ========== UI HELPERS ==========
function setActiveBadge(id) {
  document.querySelectorAll('.expert-badge').forEach(b => {
    b.classList.toggle('active', b.dataset.id === id);
    if (b.dataset.id === id) {
      b.classList.add('pulse');
      setTimeout(() => b.classList.remove('pulse'), 500);
    }
  });
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('mode-auto').classList.toggle('on', mode === 'auto');
  document.getElementById('mode-manual').value = '';
  updateStatus();
}

function setManual(expertId) {
  if (!expertId) return;
  currentMode = 'manual';
  currentExpert = expertId;
  document.getElementById('mode-auto').classList.remove('on');
  document.getElementById('mode-manual').value = expertId;
  setActiveBadge(expertId);
  updateStatus();
}

function updateStatus() {
  const bar = document.getElementById('status-bar');
  if (!apiKey) {
    bar.textContent = '⚡ ยังไม่ได้ตั้งค่า API Key';
    bar.style.color = 'var(--muted)';
    return;
  }
  const expert = EXPERTS.find(e => e.id === currentExpert);
  bar.textContent = `🟢 ${currentMode === 'auto' ? 'AUTO' : expert.label} · ${expert.model}`;
  bar.style.color = 'var(--success)';
}

// Smart routing for auto mode
function routeExpert(msg) {
  const m = msg.toLowerCase();
  if (/โค้ด|code|function|api|debug|python|javascript|html|css|sql|react|node|bug|เขียนโปรแกรม/.test(m)) return 'code';
  if (/วิเคราะห์|analysis|เหตุผล|เพราะ|ทำไม|เปรียบเทียบ|ข้อดีข้อเสีย|ตัดสินใจ|logic|reason|เลือก/.test(m) && m.length > 30) return 'reason';
  if (/พิสูจน์|คณิต|math|ฟิสิกส์|เคมี|สมการ|ทฤษฎี|axiom|logic|0\.1\+0\.2|คำนวณ|แคลคูลัส/.test(m)) return 'math';
  if (/แปล|translate|ภาษา|grammar|สรุป|summary|ภาษาไทย|อังกฤษ|จีน|ญี่ปุ่น|เกาหลี|correct|ตรวจ/.test(m)) return 'lang';
  if (/รูป|ภาพ|image|photo|picture|jpg|png|webp|http/.test(m) && /https?:\/\/\S+\.(jpg|png|webp|gif)/.test(m)) return 'vision';
  if (/เรื่องสั้น|นิยาย|บทกวี|แต่ง|creative|story|poem|เขียนเรื่อง|โฆษณา/.test(m)) return 'creative';
  if (/สั้น|เร็ว|ด่วน|instant|air|อากาศ|วันนี้|อะไร|เมื่อไหร่|ที่ไหน|how|what|when/.test(m) && m.length < 40) return 'fast';
  if (/ไทย|ภาษาไทย|คำไทย|สำนวน|สุภาพ|สละสลวย/.test(m) && m.length > 20) return 'thai';
  if (/คิดลึก|ซับซ้อน|ปรัชญา|ทฤษฎี|axiom/.test(m)) return 'deep';
  return 'general';
}

// Hint from welcome cards
function hint(text) {
  document.getElementById('user-input').value = text;
  handleSend();
}

// ========== CHAT FUNCTIONS ==========
function appendMessage(role, content, expertId = null) {
  const chat = document.getElementById('chat-window');
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const row = document.createElement('div');
  row.className = 'msg-row ' + role;

  const av = document.createElement('div');
  av.className = 'av ' + role;
  av.textContent = role === 'user' ? 'คุณ' : (EXPERTS.find(e => e.id === expertId)?.icon || '✦');

  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + role;

  if (role === 'ai' && expertId) {
    const expert = EXPERTS.find(e => e.id === expertId);
    if (expert) {
      const label = document.createElement('div');
      label.className = 'bubble-expert';
      label.style.color = expert.color;
      label.style.borderColor = expert.color + '66';
      label.innerHTML = `<span style="background:${expert.color};width:6px;height:6px;border-radius:50%;display:inline-block;"></span> ${expert.label}`;
      bubble.appendChild(label);
    }
  }

  bubble.appendChild(document.createTextNode(content));
  row.appendChild(av);
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function appendTypingIndicator(expertId) {
  const chat = document.getElementById('chat-window');
  const row = document.createElement('div');
  row.className = 'msg-row ai';
  row.id = 'typing-row';

  const av = document.createElement('div');
  av.className = 'av ai';
  av.textContent = EXPERTS.find(e => e.id === expertId)?.icon || '✦';

  const bubble = document.createElement('div');
  bubble.className = 'bubble ai';
  bubble.style.padding = '10px 14px';

  const label = document.createElement('div');
  label.className = 'routing-label';
  label.textContent = EXPERTS.find(e => e.id === expertId)?.label + ' กำลังคิด...';
  bubble.appendChild(label);

  const dots = document.createElement('div');
  dots.className = 'typing-wrap';
  dots.innerHTML = '<span></span><span></span><span></span>';
  bubble.appendChild(dots);

  row.appendChild(av);
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function removeTypingIndicator() {
  const el = document.getElementById('typing-row');
  if (el) el.remove();
}

// ========== API CALL ==========
async function handleSend() {
  const input = document.getElementById('user-input');
  const message = input.value.trim();
  if (!message) return;
  if (message.length > MAX_CHARS) {
    alert('ข้อความยาวเกิน 2000 ตัวอักษร');
    return;
  }
  if (!apiKey) {
    alert('กรุณาตั้งค่า API Key ก่อน');
    return;
  }

  input.value = '';
  document.getElementById('char-ct').textContent = '0 / ' + MAX_CHARS;

  appendMessage('user', message);

  // Determine expert
  let expertId = currentMode === 'manual' ? currentExpert : routeExpert(message);
  currentExpert = expertId;
  setActiveBadge(expertId);
  updateStatus();

  const expert = EXPERTS.find(e => e.id === expertId);
  appendTypingIndicator(expertId);

  try {
    let messages = [
      { role: 'system', content: expert.sys },
      { role: 'user', content: message }
    ];

    // Special handling for Vision expert: multimodal image input
    if (expertId === 'vision') {
      const urlMatch = message.match(/https?:\/\/\S+\.(jpg|png|webp|gif)/i);
      if (urlMatch) {
        messages = [
          { role: 'system', content: expert.sys },
          {
            role: 'user',
            content: [
              { type: 'text', text: message.replace(urlMatch[0], '').trim() || 'อธิบายภาพนี้ให้ละเอียด' },
              { type: 'image_url', image_url: { url: urlMatch[0] } }
            ]
          }
        ];
      }
    }

    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${apiKey}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: expert.model,
        messages: messages,
        temperature: 0.7,
        max_tokens: 2048
      })
    });

    const data = await response.json();
    removeTypingIndicator();

    if (data.choices && data.choices[0]) {
      const reply = data.choices[0].message.content;
      appendMessage('ai', reply, expertId);
    } else {
      throw new Error(data.error?.message || 'ไม่มีคำตอบจาก AI');
    }
  } catch (err) {
    removeTypingIndicator();
    appendMessage('ai', '❌ เกิดข้อผิดพลาด: ' + err.message, expertId);
    const bar = document.getElementById('status-bar');
    bar.textContent = '⚠️ การเชื่อมต่อล้มเหลว';
    bar.style.color = 'var(--danger)';
  }
}

// ========== API KEY MANAGEMENT ==========
function saveKey() {
  apiKey = document.getElementById('api-key').value.trim();
  localStorage.setItem('dakno_groq_key', apiKey);
  updateStatus();
}

async function verifyKey() {
  const key = document.getElementById('api-key').value.trim();
  if (!key) {
    alert('กรุณากรอก API Key');
    return;
  }
  const bar = document.getElementById('status-bar');
  bar.textContent = '⏳ กำลังทดสอบ...';
  bar.style.color = 'var(--muted)';
  try {
    const res = await fetch('https://api.groq.com/openai/v1/models', {
      headers: { 'Authorization': `Bearer ${key}` }
    });
    if (res.ok) {
      bar.textContent = '✅ API Key ถูกต้อง';
      bar.style.color = 'var(--success)';
      apiKey = key;
      localStorage.setItem('dakno_groq_key', key);
    } else {
      throw new Error('Invalid key');
    }
  } catch (e) {
    bar.textContent = '❌ API Key ไม่ถูกต้อง';
    bar.style.color = 'var(--danger)';
  }
}

// ========== EVENT LISTENERS ==========
document.getElementById('send-btn').addEventListener('click', handleSend);
document.getElementById('btn-test').addEventListener('click', verifyKey);
document.getElementById('user-input').addEventListener('input', function() {
  document.getElementById('char-ct').textContent = this.value.length + ' / ' + MAX_CHARS;
});
document.getElementById('user-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

// ========== INIT ==========
document.getElementById('api-key').value = apiKey;
setActiveBadge('general');
updateStatus();
</script>
