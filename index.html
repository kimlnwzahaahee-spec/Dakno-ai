<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dakno AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080b12;
  --surface: #0d1117;
  --panel: #111827;
  --card: #161d2b;
  --border: #1e2d42;
  --border-glow: #2563eb44;
  --accent: #3b82f6;
  --accent2: #60a5fa;
  --accent-glow: #3b82f622;
  --text: #e2e8f0;
  --muted: #64748b;
  --danger: #ef4444;
  --success: #22c55e;
  --radius: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Kanit', sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-weight: 300;
}

/* Background mesh */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 0%, #1e3a5f22 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 80% 100%, #1e3a8a18 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ===== HEADER ===== */
header {
  position: relative;
  z-index: 10;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  background: rgba(8,11,18,0.9);
  backdrop-filter: blur(20px);
}

.logo-box {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, #1d4ed8, #3b82f6);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  box-shadow: 0 0 16px #3b82f644;
  position: relative;
  overflow: hidden;
}

.logo::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
  border-radius: inherit;
}

.logo-text { line-height: 1; }
.logo-title { font-size: 17px; font-weight: 600; letter-spacing: 0.5px; }
.logo-sub { font-size: 10px; color: var(--muted); font-weight: 300; letter-spacing: 1px; text-transform: uppercase; }

/* API Key area */
.key-area {
  display: flex;
  gap: 8px;
  align-items: center;
}

#api-key {
  width: 100px;
  padding: 7px 10px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  transition: border-color .2s, box-shadow .2s;
}
#api-key:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.btn-sm {
  padding: 7px 12px;
  border: 1px solid transparent;
  color: white;
  font-size: 12px;
  cursor: pointer;
  border-radius: 10px;
  font-family: 'Kanit', sans-serif;
  font-weight: 400;
  transition: all .2s;
  letter-spacing: 0.3px;
}
#btn-save {
  background: var(--card);
  border-color: var(--border);
  color: var(--muted);
}
#btn-save:hover { border-color: var(--accent); color: var(--accent2); }
#btn-test {
  background: var(--accent);
  box-shadow: 0 2px 12px #3b82f640;
}
#btn-test:hover { background: #2563eb; box-shadow: 0 2px 20px #3b82f660; }
#btn-test:disabled { opacity: .5; cursor: default; }

/* ===== CHAT WINDOW ===== */
#chat-window {
  position: relative;
  z-index: 1;
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scroll-behavior: smooth;
}
#chat-window::-webkit-scrollbar { width: 4px; }
#chat-window::-webkit-scrollbar-track { background: transparent; }
#chat-window::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ===== WELCOME ===== */
#welcome-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  text-align: center;
  gap: 24px;
  animation: fadeIn .5s ease;
}
@keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }

.welcome-icon {
  width: 64px;
  height: 64px;
  background: linear-gradient(135deg, #1d4ed8, #3b82f6);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  box-shadow: 0 0 40px #3b82f640;
  animation: pulse 3s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 30px #3b82f630; }
  50% { box-shadow: 0 0 50px #3b82f660; }
}

#welcome-screen h2 { font-size: 22px; font-weight: 500; color: var(--text); }
#welcome-screen p { color: var(--muted); font-size: 13px; }

.suggestions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: 100%;
  max-width: 360px;
}

.chip {
  background: var(--card);
  padding: 14px 12px;
  border-radius: 14px;
  border: 1px solid var(--border);
  cursor: pointer;
  text-align: left;
  font-size: 13px;
  font-family: 'Kanit', sans-serif;
  font-weight: 300;
  color: var(--text);
  transition: all .2s;
  line-height: 1.6;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.chip .chip-icon { font-size: 18px; }
.chip .chip-text { color: var(--muted); font-size: 12px; }
.chip:hover {
  background: #1a2540;
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 4px 20px #3b82f620;
}

/* ===== BUBBLES ===== */
.msg-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  animation: fadeUp .25s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg-row.user { flex-direction: row-reverse; }

.avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
}
.avatar.ai-av {
  background: linear-gradient(135deg, #1d4ed8, #3b82f6);
  box-shadow: 0 0 10px #3b82f640;
}
.avatar.user-av {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--muted);
}

.bubble {
  padding: 12px 16px;
  border-radius: 18px;
  max-width: 82%;
  line-height: 1.7;
  font-size: 14px;
  word-wrap: break-word;
  white-space: pre-wrap;
  font-weight: 300;
}

.bubble.user {
  background: linear-gradient(135deg, #1d4ed8, #2563eb);
  border-bottom-right-radius: 5px;
  box-shadow: 0 2px 12px #2563eb40;
}
.bubble.ai {
  background: var(--card);
  border: 1px solid var(--border);
  border-bottom-left-radius: 5px;
  color: var(--text);
}
.bubble.ai a { color: var(--accent2); text-decoration: none; border-bottom: 1px solid #60a5fa44; }
.bubble.ai a:hover { color: white; border-color: var(--accent); }

/* Typing indicator */
.typing-indicator {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 14px 18px;
}
.typing-indicator span {
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
  animation: bounce 1.2s ease-in-out infinite;
  opacity: 0.7;
}
.typing-indicator span:nth-child(2) { animation-delay: .2s; }
.typing-indicator span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
  40% { transform: translateY(-6px); opacity: 1; }
}

/* ===== STATUS BAR ===== */
#status-bar {
  position: relative;
  z-index: 10;
  font-size: 11px;
  padding: 0 20px 6px;
  flex-shrink: 0;
  min-height: 20px;
  font-family: 'JetBrains Mono', monospace;
  transition: color .3s;
}
#status-bar.ok { color: var(--success); }
#status-bar.err { color: var(--danger); }
#status-bar.info { color: var(--muted); }

/* ===== INPUT AREA ===== */
.input-area {
  position: relative;
  z-index: 10;
  padding: 12px 16px 16px;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  background: rgba(8,11,18,0.95);
  backdrop-filter: blur(20px);
}

.input-wrapper {
  flex: 1;
  position: relative;
}

#user-input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 16px;
  border-radius: 14px;
  resize: none;
  outline: none;
  font-size: 14px;
  font-family: 'Kanit', sans-serif;
  font-weight: 300;
  min-height: 46px;
  max-height: 120px;
  overflow-y: auto;
  line-height: 1.5;
  transition: border-color .2s, box-shadow .2s;
  display: block;
}
#user-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
#user-input::placeholder { color: var(--muted); }

.send-btn {
  width: 46px;
  height: 46px;
  background: linear-gradient(135deg, #1d4ed8, #3b82f6);
  border-radius: 14px;
  border: none;
  cursor: pointer;
  color: white;
  flex-shrink: 0;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s;
  box-shadow: 0 2px 14px #3b82f640;
}
.send-btn:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 4px 22px #3b82f660;
}
.send-btn:active:not(:disabled) { transform: scale(.95); }
.send-btn:disabled { opacity: .35; cursor: default; }

/* Token counter */
.char-count {
  font-size: 10px;
  color: var(--muted);
  text-align: right;
  padding: 4px 4px 0;
  font-family: 'JetBrains Mono', monospace;
}

/* Clear button */
.clear-btn {
  position: absolute;
  top: 14px;
  right: 60px;
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  padding: 2px 6px;
  border-radius: 6px;
  display: none;
  z-index: 5;
  font-family: 'Kanit', sans-serif;
  transition: color .2s;
}
.clear-btn:hover { color: var(--danger); }
</style>
</head>
<body>

<header>
  <div class="logo-box">
    <div class="logo">✦</div>
    <div class="logo-text">
      <div class="logo-title">Dakno AI</div>
      <div class="logo-sub">Powered by Groq</div>
    </div>
  </div>
  <div class="key-area">
    <input type="password" id="api-key" placeholder="Groq API Key">
    <button class="btn-sm" id="btn-save" onclick="saveKey()">บันทึก</button>
    <button class="btn-sm" id="btn-test" onclick="verifyKey()">ทดสอบ</button>
  </div>
</header>

<div id="chat-window">
  <div id="welcome-screen">
    <div class="welcome-icon">✦</div>
    <div>
      <h2>สวัสดีครับ ผม Dakno</h2>
      <p style="margin-top:6px">ใส่ Groq API Key แล้วเริ่มสนทนาได้เลยครับ</p>
    </div>
    <div class="suggestions">
      <div class="chip" onclick="sendSuggestion('แนะนำตัวเองหน่อย')">
        <span class="chip-icon">👋</span>
        <span>แนะนำตัวเอง</span>
        <span class="chip-text">Dakno คือใคร?</span>
      </div>
      <div class="chip" onclick="sendSuggestion('เว็บเรียน Python ฟรีที่ดีที่สุดมีที่ไหนบ้าง')">
        <span class="chip-icon">💻</span>
        <span>เรียนโค้ด</span>
        <span class="chip-text">แหล่งเรียน Python ฟรี</span>
      </div>
      <div class="chip" onclick="sendSuggestion('อธิบาย AI ให้เข้าใจง่ายๆ')">
        <span class="chip-icon">🧠</span>
        <span>อธิบาย AI</span>
        <span class="chip-text">เข้าใจง่ายๆ</span>
      </div>
      <div class="chip" onclick="sendSuggestion('ช่วยแปล: The weather is beautiful today')">
        <span class="chip-icon">🌍</span>
        <span>แปลภาษา</span>
        <span class="chip-text">EN → TH</span>
      </div>
    </div>
  </div>
</div>

<div id="status-bar" class="info"></div>

<div class="input-area">
  <div class="input-wrapper">
    <textarea id="user-input" placeholder="พิมพ์ข้อความ... (Enter ส่ง, Shift+Enter ขึ้นบรรทัดใหม่)" rows="1"></textarea>
    <div class="char-count" id="char-count">0 / 2000</div>
  </div>
  <button class="send-btn" id="send-btn" onclick="handleSend()" title="ส่งข้อความ">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"></line>
      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
    </svg>
  </button>
</div>

<script>
// ===== STATE =====
let conversationHistory = [];
let isLoading = false;

const inputField = document.getElementById('user-input');
const chatWindow = document.getElementById('chat-window');
const statusBar = document.getElementById('status-bar');
const sendBtn = document.getElementById('send-btn');
const charCount = document.getElementById('char-count');

// โหลด key จาก storage
const savedKey = localStorage.getItem('groq_key') || '';
document.getElementById('api-key').value = savedKey;
if (savedKey) showStatus('✓ โหลด API Key แล้ว', 'ok');

// Auto-resize textarea
inputField.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  const len = this.value.length;
  charCount.textContent = `${len} / 2000`;
  charCount.style.color = len > 1800 ? '#ef4444' : 'var(--muted)';
});

inputField.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

// ===== KEY FUNCTIONS =====
function saveKey() {
  const k = document.getElementById('api-key').value.trim();
  if (!k) return showStatus('❌ กรุณาใส่ Key ก่อน', 'err');
  localStorage.setItem('groq_key', k);
  showStatus('✅ บันทึก Key เรียบร้อย', 'ok');
}

async function verifyKey() {
  const key = document.getElementById('api-key').value.trim();
  if (!key) return showStatus('❌ กรุณาใส่ Key ก่อน', 'err');
  const btn = document.getElementById('btn-test');
  btn.textContent = '...';
  btn.disabled = true;
  showStatus('⏳ กำลังตรวจสอบ Key...', 'info');
  try {
    const res = await fetch('https://api.groq.com/openai/v1/models', {
      headers: { 'Authorization': `Bearer ${key}` }
    });
    if (res.ok) {
      showStatus('✅ Key ใช้งานได้ พร้อมสนทนาแล้ว!', 'ok');
    } else {
      showStatus('❌ Key ผิดหรือหมดอายุ กรุณาตรวจสอบ', 'err');
    }
  } catch {
    showStatus('❌ เชื่อมต่อไม่ได้ กรุณาเช็คเน็ต', 'err');
  }
  btn.textContent = 'ทดสอบ';
  btn.disabled = false;
}

function showStatus(msg, type = 'info') {
  statusBar.textContent = msg;
  statusBar.className = type;
  clearTimeout(statusBar._timer);
  statusBar._timer = setTimeout(() => {
    statusBar.textContent = '';
    statusBar.className = 'info';
  }, 4000);
}

// ===== ADD MESSAGE =====
function addMessage(text, role) {
  const welcome = document.getElementById('welcome-screen');
  if (welcome) welcome.remove();

  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role === 'ai' ? 'ai-av' : 'user-av'}`;
  avatar.textContent = role === 'ai' ? '✦' : '👤';

  const bubble = document.createElement('div');
  bubble.className = `bubble ${role}`;

  if (role === 'ai') {
    bubble.innerHTML = formatText(text);
  } else {
    bubble.textContent = text;
  }

  row.appendChild(avatar);
  row.appendChild(bubble);
  chatWindow.appendChild(row);
  chatWindow.scrollTop = chatWindow.scrollHeight;
  return bubble;
}

function addTyping() {
  const welcome = document.getElementById('welcome-screen');
  if (welcome) welcome.remove();

  const row = document.createElement('div');
  row.className = 'msg-row ai';
  row.id = 'typing-row';

  const avatar = document.createElement('div');
  avatar.className = 'avatar ai-av';
  avatar.textContent = '✦';

  const bubble = document.createElement('div');
  bubble.className = 'bubble ai';
  bubble.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;

  row.appendChild(avatar);
  row.appendChild(bubble);
  chatWindow.appendChild(row);
  chatWindow.scrollTop = chatWindow.scrollHeight;
  return { row, bubble };
}

// ===== FORMAT =====
function formatText(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code style="background:#1e2d42;padding:1px 6px;border-radius:5px;font-family:JetBrains Mono,monospace;font-size:12px;">$1</code>')
    .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

// ===== MATH =====
function tryMath(text) {
  const clean = text.trim();
  if (!/^[\d\s()+\-*/.%]+$/.test(clean)) return null;
  if (!/[+\-*/]/.test(clean)) return null;
  try {
    const result = Function('"use strict"; return (' + clean.replace(/\s/g,'') + ')')();
    return isFinite(result) ? result : null;
  } catch { return null; }
}

// ===== CLEAR CHAT =====
function clearChat() {
  conversationHistory = [];
  chatWindow.innerHTML = '';
  showStatus('🗑️ ล้างการสนทนาแล้ว', 'info');
}

// ===== SEND =====
function sendSuggestion(text) { handleSend(text); }

async function handleSend(predefinedText) {
  if (isLoading) return;
  const text = predefinedText || inputField.value.trim();
  if (!text || text.length > 2000) {
    if (text.length > 2000) showStatus('❌ ข้อความยาวเกินไป (สูงสุด 2000 ตัวอักษร)', 'err');
    return;
  }

  const key = localStorage.getItem('groq_key') || document.getElementById('api-key').value.trim();
  if (!key) return showStatus('⚠️ กรุณาใส่ Groq API Key ก่อนนะครับ', 'err');

  // แสดง user message
  addMessage(text, 'user');
  inputField.value = '';
  inputField.style.height = 'auto';
  charCount.textContent = '0 / 2000';

  // Math shortcut
  const mathResult = tryMath(text);
  if (mathResult !== null) {
    conversationHistory.push({ role: 'user', content: text });
    const reply = `${text} = **${mathResult}**`;
    addMessage(reply, 'ai');
    conversationHistory.push({ role: 'assistant', content: reply });
    return;
  }

  // Typing
  isLoading = true;
  sendBtn.disabled = true;
  const { row: typingRow, bubble: typingBubble } = addTyping();

  conversationHistory.push({ role: 'user', content: text });

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        max_tokens: 1024,
        temperature: 0.7,
        messages: [
          {
            role: 'system',
            content: 'คุณคือผู้ช่วย AI ที่ชื่อ Dakno ใจดี ใจเย็น สุภาพ ตอบเป็นภาษาไทยเสมอ ใช้สรรพนาม "ผม" และลงท้ายด้วย "ครับ" ให้ข้อมูลที่เป็นประโยชน์ ถูกต้อง และตรงประเด็น สามารถใช้ **bold** และ *italic* ได้ ห้ามใช้คำหยาบหรือภาษารุนแรง'
          },
          ...conversationHistory
        ]
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    const data = await res.json();
    const reply = data.choices[0].message.content;

    // เปลี่ยน typing เป็น reply จริง
    typingBubble.innerHTML = formatText(reply);
    chatWindow.scrollTop = chatWindow.scrollHeight;

    conversationHistory.push({ role: 'assistant', content: reply });

    // จำกัดประวัติ 30 ข้อความ
    if (conversationHistory.length > 30) {
      conversationHistory = conversationHistory.slice(-30);
    }

    // แสดง model stats
    if (data.usage) {
      const { prompt_tokens, completion_tokens } = data.usage;
      showStatus(`✓ ตอบแล้ว · ${prompt_tokens + completion_tokens} tokens`, 'info');
    }

  } catch (e) {
    typingBubble.innerHTML = `<span style="color:#ef4444">❌ เกิดข้อผิดพลาด: ${e.message}</span>`;
    conversationHistory.pop();
    showStatus('❌ ' + e.message, 'err');
  }

  isLoading = false;
  sendBtn.disabled = false;
  inputField.focus();
}
</script>
</body>
</html>
