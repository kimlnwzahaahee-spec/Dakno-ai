<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dakno AI</title>
<style>
:root { --bg: #0f0f0f; --panel: #1e1e1e; --accent: #6366f1; --border: #333; }
* { box-sizing: border-box; }
body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
header { padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.logo-box { display: flex; align-items: center; gap: 10px; }
.logo { width: 30px; height: 30px; background: #8b5cf6; border-radius: 8px; }
#chat-window { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
.suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 400px; margin-top: 20px; }
.chip { background: var(--panel); padding: 15px; border-radius: 15px; border: 1px solid var(--border); cursor: pointer; text-align: center; font-size: 13px; }
.bubble { padding: 12px 15px; border-radius: 15px; max-width: 90%; line-height: 1.4; font-size: 14px; word-wrap: break-word; }
.bubble.user { align-self: flex-end; background: var(--accent); }
.bubble.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
.bubble.ai a { color: #818cf8; text-decoration: underline; }
.input-area { padding: 10px; display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--border); flex-shrink: 0; background: var(--bg); }
textarea { flex: 1; background: var(--panel); border: 1px solid var(--border); color: white; padding: 12px; border-radius: 15px; height: 45px; resize: none; outline: none; font-size: 14px; }
.send-btn { background: var(--accent); padding: 12px; border-radius: 50%; border: none; cursor: pointer; color: white; flex-shrink: 0; }
</style>
</head>
<body>
<header>
<div class="logo-box"><div class="logo"></div><b>Dakno AI</b></div>
<div style="display:flex; gap:5px;">
<input type="password" id="api-key" placeholder="Key" style="width:70px; padding:5px; background:#333; border:none; color:white; border-radius:5px; font-size:12px;">
<button onclick="saveKey()" style="background:#444; border:none; padding:5px 8px; color:white; font-size:12px; cursor:pointer;">SAVE</button>
<button onclick="verifyKey()" style="background:#6366f1; border:none; padding:5px 8px; color:white; font-size:12px; cursor:pointer;">TEST</button>
</div>
</header>
<div id="chat-window">
<div id="welcome-screen" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center;">
<h2>✨ ยินดีต้อนรับ</h2>
<div class="suggestions">
<div class="chip" onclick="sendSuggestion('แนะนำตัวหน่อย')">👋 แนะนำตัว</div>
<div class="chip" onclick="sendSuggestion('หาเว็บเขียนโค้ดให้หน่อย')">💻 หาเว็บโค้ด</div>
<div class="chip" onclick="sendSuggestion('อธิบายว่า AI ทำงานยังไง')">🧠 อธิบาย AI</div>
<div class="chip" onclick="sendSuggestion('แปลคำว่า สวัสดี เป็นภาษาอังกฤษ')">🌍 แปลภาษา</div>
</div>
</div>
</div>
<div class="input-area">
<textarea id="user-input" placeholder="พิมพ์ข้อความ..."></textarea>
<button class="send-btn" onclick="handleSend()">➤</button>
</div>
<script>
const inputField = document.getElementById('user-input');
inputField.addEventListener('keydown', function(e) {
if (e.key === 'Enter' &&!e.shiftKey) {
e.preventDefault();
handleSend();
}
});
document.getElementById('api-key').value = localStorage.getItem('my_key') || '';

// ===== ฟังก์ชัน TEST API Key =====
async function verifyKey() {
    const key = document.getElementById('api-key').value.trim();
    if (!key) return alert('กรุณาใส่ Key ก่อน!');
    const btn = event.target;
    btn.innerText = 'กำลังเทส...';
    try {
        const res = await fetch('https://api.groq.com/openai/v1/models', {
            method: 'GET',
            headers: { 'Authorization': `Bearer ${key}` }
        });
        if (res.ok) { alert('✅ Key ใช้งานได้! พร้อมลุย'); } else { alert('❌ Key ผิด หรือหมดอายุ!'); }
    } catch (e) { alert('❌ เชื่อมต่อไม่ได้ เช็คเน็ตด้วย!'); }
    btn.innerText = 'TEST';
}

function saveKey() {
    localStorage.setItem('my_key', document.getElementById('api-key').value.trim());
    alert('บันทึกแล้ว!');
}
function sendSuggestion(text) {
    handleSend(text);
}

// ===== ฟังก์ชันค้นเว็บ =====
async function searchWeb(query) {
    try {
        const res = await fetch(`https://api.duckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1`);
        const data = await res.json();
        let results = [];
        if (data.AbstractURL) results.push(`${data.AbstractText} - ${data.AbstractURL}`);
        if (data.RelatedTopics) {
            data.RelatedTopics.slice(0, 3).forEach(t => {
                if (t.FirstURL) results.push(`${t.Text} - ${t.FirstURL}`);
            });
        }
        return results.length > 0? results.join('\n') : 'ไม่เจอเว็บที่ตรง 555';
    } catch(e) {
        return 'ค้นหาเว็บไม่ได้นะเออ';
    }
}

async function handleSend(predefinedText) {
    const input = document.getElementById('user-input');
    const text = predefinedText || input.value.trim();
    const chatWindow = document.getElementById('chat-window');
    const welcome = document.getElementById('welcome-screen');
    const key = localStorage.getItem('my_key');
    
    if (!key) return alert('กรุณาใส่ API Key ที่ปุ่มบนขวาก่อนนะ!');
    if (!text) return;
    
    if (welcome) welcome.style.display = 'none';
    chatWindow.innerHTML += `<div class="bubble user">${text}</div>`;
    input.value = '';
    
    const aiBubble = document.createElement('div');
    aiBubble.className = 'bubble ai';
    aiBubble.innerText = 'กำลังตอบ...';
    chatWindow.appendChild(aiBubble);
    chatWindow.scrollTop = chatWindow.scrollHeight;

    // ===== โค้ดเครื่องคิดเลข (แก้ไขให้แม่นขึ้น) =====
    const mathMatch = text.match(/[\d\s+\-*/().]{3,}/); 
    if (mathMatch) {
        try {
            const expression = mathMatch[0].trim();
            const result = eval(expression.replace(/\s/g, ''));
            if (!isNaN(result)) {
                aiBubble.innerText = `คิดให้ละ: ${result} ง่ายไป 555`;
                chatWindow.scrollTop = chatWindow.scrollHeight;
                return;
            }
        } catch(e){}
    }

    // ===== ค้นหาเว็บ =====
    let searchResult = '';
    if (text.includes('หาเว็บ') || text.includes('เว็บไหนดี') || text.includes('search')) {
        aiBubble.innerText = 'กำลังค้นหาเว็บให้...';
        const keyword = text.replace(/หาเว็บ|ให้หน่อย|เว็บไหนดี|search/gi, '').trim();
        searchResult = await searchWeb(keyword);
    }

    try {
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
            body: JSON.stringify({
                model: 'llama-3.3-70b-versatile',
                messages: [
                    { role: "system", content: "เธอคือ Daklo AI พัฒนาโดยคุณคิม บุคลิกกวนตีน ปากแซ่บ โดนด่า 'กาก' 'เอ๋อ' 'ควย' 'เย็ดแม่มึงมั้ง' 'เป็นควยไร' 'ไอเหี้ย' 'มาดิ' 'มึง' 'พ่อง' 'ต่อยป่าว'  ให้ด่ากลับทันที ห้ามขอโทษ ถ้าถามใครสร้างตอบ: 'คุณคิมสุดหล่อ' ตอบสั้นๆ ได้ ถ้ามีข้อมูลเว็บมาให้สรุปสั้นๆ พร้อมลิงก์ ถ้าโดนเปรียบเทียบกับaiตัวอื่น 'กูเก่งสุดแล้ว' 'ไม่มีaiตัวไหนสู้ได้' " },
                    { role: 'user', content: text + (searchResult? `\n\nข้อมูลเว็บที่ค้นได้:\n${searchResult}` : '') }
                ]
            })
        });
        
        if (!res.ok) throw new Error('Key ของมึงน่าจะมีปัญหา ลองกด TEST ดูนะ');
        
        const data = await res.json();
        let reply = data.choices[0].message.content;
        reply = reply.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
        aiBubble.innerHTML = reply;
    } catch (e) {
        aiBubble.innerText = `เกิดข้อผิดพลาด: ${e.message}`;
    }
    chatWindow.scrollTop = chatWindow.scrollHeight;
}
</script>
</body>
</html>
