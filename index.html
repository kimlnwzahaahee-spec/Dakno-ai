<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dakno Vision Pro — Unified AI</title>
  <style>
    /* รวม CSS จากทั้งสองโปรเจกต์ไว้ที่นี่ */
    :root {
      --bg: #07090f;
      --card: #141824;
      --accent: #4f8aff;
      --text: #dde4f0;
      /* ... รวมสีอื่นๆ จากทั้งสองโปรเจกต์มาไว้ที่นี่ ... */
    }
    
    body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; }
    
    /* Layout */
    .app-container { display: flex; flex-direction: column; height: 100vh; }
    .header { padding: 20px; border-bottom: 1px solid #1c2236; }
    
    /* Tab System */
    .tab-nav { display: flex; gap: 10px; padding: 10px; background: #0c0f1a; }
    .tab-btn { padding: 10px 20px; cursor: pointer; border: none; background: transparent; color: #6b7894; }
    .tab-btn.active { color: white; border-bottom: 2px solid var(--accent); }
    
    .view { display: none; height: 100%; overflow-y: auto; }
    .view.active { display: block; }
  </style>
</head>
<body>

<div class="app-container">
  <header class="header">
    <input type="password" id="api-key" placeholder="Enter Groq API Key">
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" onclick="switchView('chat')">Chat AI</button>
    <button class="tab-btn" onclick="switchView('vision')">Vision</button>
    <button class="tab-btn" onclick="switchView('camera')">Camera</button>
  </nav>

  <main id="main-content">
    <div id="view-chat" class="view active">
      </div>
    <div id="view-vision" class="view">
      </div>
    <div id="view-camera" class="view">
      </div>
  </main>
</div>

<script>
  // 1. Unified API Key Getter
  function getApiKey() { return document.getElementById('api-key').value; }

  // 2. Tab Swapper
  function switchView(viewName) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    
    document.getElementById('view-' + viewName).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  // 3. รวมฟังก์ชัน Call API ไว้ที่นี่ เพื่อให้เรียกใช้ได้ทุกหน้า
  async function callGroq(model, messages, imageBase64 = null) {
    const key = getApiKey();
    if(!key) { alert("กรุณากรอก API Key"); return; }
    
    // logic สำหรับ fetch ไปยัง Groq API
  }
</script>
</body>
</html>
