<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dakno AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap');
:root { --bg: #0f0f0f; --panel: #1a1a1a; --accent: #6366f1; --border: #2a2a2a; --text: #e8e8e8; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Sarabun', sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

/* Header */
header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; background: #111; }
.logo-box { display: flex; align-items: center; gap: 10px; }
.logo { width: 32px; height: 32px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.logo-title { font-size: 16px; font-weight: 600; }
.key-area { display: flex; gap: 6px; align-items: center; }
#api-key { width: 90px; padding: 6px 8px; background: #222; border: 1px solid var(--border); color: white; border-radius: 8px; font-size: 12px; font-family: monospace; }
#api-key:focus { outline: none; border-color: var(--accent); }
.btn-sm { padding: 6px 10px; border: none; color: white; font-size: 11px; cursor: pointer; border-radius: 8px; font-family: 'Sarabun', sans-serif; transition: opacity .2s; }
.btn-sm:hover { opacity: .8; }
#btn-save { background: #333; }
#btn-test { background: var(--accent); }

/* Chat Window */
#chat-window { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
#chat-window::-webkit-scrollbar { width: 4px; }
#chat-window::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

/* Welcome */
#welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; gap: 20px; }
#welcome-screen h2 { font-size: 22px; font-weight: 600; color: #ccc; }
.suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 380px; }
.chip { background: var(--panel); padding: 14px 10px; border-radius: 14px; border: 1px solid var(--border); cursor: pointer; text-align: center; font-size: 13px; font-family: 'Sarabun', sans-serif; color: var(--text); transition: background .2s, border-color .2s; line-height: 1.5; }
.chip:hover { background: #222; border-color: var(--accent); }

/* Bubbles */
.bubble { padding: 11px 15px; border-radius: 16px; max-width: 88%; line-height: 1.6; font-size: 14px; word-wrap: break-word; white-space: pre-wrap; animation: fadeUp .2s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.bubble.user { align-self: flex-end; background: var(--accent); border-bottom-right-radius: 4px; }
.bubble.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.bubble.ai a { color: #818cf8; text-decoration: underline; }
.bubble.typing { color: #888; font-style: italic; }

/* Input */
.input-area { padding: 10px 12px; display: flex; gap: 8px; align-items: flex-end; border-top: 1px solid var(--border); flex-shrink: 0; background: var(--bg); }
#user-input { flex: 1; background: var(--panel); border: 1px solid var(--border); color: white; padding: 11px 14px; border-radius: 14px; resize: none; outline: none; font-size: 14px; font-family: 'Sarabun', sans-serif; min-height: 44px; max-height: 120px; overflow-y: auto; line-height: 1.5; transition: border-color .2s; }
#user-input:focus { border-color: var(--accent); }
.send-btn { background: var(--accent); width: 44px; height: 44px; border-radius: 12px; border: none; cursor: pointer; color: white; flex-shrink: 0; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: opacity .2s, transform .1s; }
.send-btn:hover { opacity: .85; }
.send-btn:active { transform: scale(.95); }
.send-btn:disabled { opacity: .4; cursor: default; }

/* Status */
#status-bar { font-size: 11px; color: #555; padding: 0 16px 6px; flex-shrink: 0; }
</style>
</head>
<body>

<header>
  <div class="logo-box">
    <div class="logo">✦</div>
    <span class="logo-title">Dakno AI</span>
  </div>
  <div class="key-area">
    <input type="password" id="api-key" placeholder="Groq API Key">
    <button class="btn-sm" id="btn-save" onclick="saveKey()">บันทึก</button>
    <button class="btn-sm" id="btn-test" onclick="verifyKey()">ทดสอบ</button>
  </div>
</header>

<div id="chat-window">
  <div id="welcome-screen">
    <h2>✨ สวัสดีครับ</h2>
    <p style="color:#666; font-size:13px;">ใส่ Groq API Key แล้วเริ่มคุยได้เลย</p>
    <div class="suggestions">
      <div class="chip" onclick="sendSuggestion('แนะนำตัวเองหน่อย')">👋 แนะนำตัว</div>
      <div class="chip" onclick="sendSuggestion('เว็บเขียนโค้ด Python ฟรีมีที่ไหนบ้าง')">💻 หาแหล่งเรียนโค้ด</div>
      <div class="chip" onclick="sendSuggestion('อธิบายว่า AI ทำงานยังไงแบบเข้าใจง่าย')">🧠 อธิบาย AI</div>
      <div class="chip" onclick="sendSuggestion('แปลคำว่า สวัสดี เป็นภาษาอังกฤษ')">🌍 แปลภาษา</div>
    </div>
  </div>
</div>

<div id="status-bar"></div>

<div class="input-area">
  <textarea id="user-input" placeholder="พิมพ์ข้อความ..." rows="1"></textarea>
  <button class="send-btn" id="send-btn" onclick="handleSend()">➤</button>
</div>

<script>
// ===== State =====
let conversationHistory = [];
let isLoading = false;

const inputField = document.getElementById('user-input');
const chatWindow = document.getElementById('chat-window');
const statusBar = document.getElementById('status-bar');
const sendBtn = document.getElementById('send-btn');

// โหลด key
document.getElementById('api-key').value = localStorage.getItem('groq_key') || '';

// Auto-resize textarea
inputField.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

inputField.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

// ===== บันทึก Key =====
function saveKey() {
  const k = document.getElementById('api-key').value.trim();
  if (!k) return showStatus('❌ กรุณาใส่ Key ก่อน');
  localStorage.setItem('groq_key', k);
  showStatus('✅ บันทึก Key แล้ว');
}

// ===== ทดสอบ Key =====
async function verifyKey() {
  const key = document.getElementById('api-key').value.trim();
  if (!key) return showStatus('❌ กรุณาใส่ Key ก่อน');
  const btn = document.getElementById('btn-test');
  btn.textContent = '...';
  btn.disabled = true;
  try {
    const res = await fetch('https://api.groq.com/openai/v1/models', {
      headers: { 'Authorization': `Bearer ${key}` }
    });
    showStatus(res.ok ? '✅ Key ใช้งานได้ พร้อมแล้ว!' : '❌ Key ผิดหรือหมดอายุ');
  } catch {
    showStatus('❌ เชื่อมต่อไม่ได้ เช็คเน็ตด้วย');
  }
  btn.textContent = 'ทดสอบ';
  btn.disabled = false;
}

function showStatus(msg) {
  statusBar.textContent = msg;
  setTimeout(() => { statusBar.textContent = ''; }, 4000);
}

// ===== เพิ่ม Bubble =====
function addBubble(text, role) {
  const welcome = document.getElementById('welcome-screen');
  if (welcome) welcome.remove();

  const div = document.createElement('div');
  div.className = `bubble ${role}`;
  if (role === 'ai') div.innerHTML = formatText(text);
  else div.textContent = text;
  chatWindow.appendChild(div);
  chatWindow.scrollTop = chatWindow.scrollHeight;
  return div;
}

// ===== Format ลิงก์ =====
function formatText(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

// ===== Calculator (เฉพาะเลขคำนวณจริงๆ) =====
function tryMath(text) {
  // รับเฉพาะนิพจน์ที่ขึ้นต้นด้วยตัวเลขและมีเครื่องหมายคำนวณ
  const match = text.trim().match(/^[\d\s()+\-*/.]+$/);
  if (!match) return null;
  if (!/[+\-*/]/.test(text)) return null; // ต้องมีเครื่องหมายอย่างน้อย 1 ตัว
  try {
    const result = Function('"use strict"; return (' + text.replace(/\s/g,'') + ')')();
    return isFinite(result) ? result : null;
  } catch { return null; }
}

// ===== ส่งข้อความ =====
function sendSuggestion(text) { handleSend(text); }

async function handleSend(predefinedText) {
  if (isLoading) return;
  const text = predefinedText || inputField.value.trim();
  if (!text) return;

  const key = localStorage.getItem('groq_key') || document.getElementById('api-key').value.trim();
  if (!key) return showStatus('⚠️ กรุณาใส่ Groq API Key ก่อนนะ');

  // แสดง user bubble
  addBubble(text, 'user');
  inputField.value = '';
  inputField.style.height = 'auto';

  // เช็คเครื่องคิดเลข
  const mathResult = tryMath(text);
  if (mathResult !== null) {
    conversationHistory.push({ role: 'user', content: text });
    const reply = `${text} = ${mathResult}`;
    addBubble(reply, 'ai');
    conversationHistory.push({ role: 'assistant', content: reply });
    return;
  }

  // สร้าง typing bubble
  isLoading = true;
  sendBtn.disabled = true;
  const typingBubble = addBubble('กำลังตอบ...', 'ai');
  typingBubble.classList.add('typing');

  // เพิ่มประวัติ
  conversationHistory.push({ role: 'user', content: text });

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        max_tokens: 1024,
        messages: [
          {
            role: 'system',
            content: 'คุณคือผู้ช่วย AI ที่ชื่อ Dakno ใจดี ใจเย็น สุภาพ ใช้สรรพนามแทนตัวว่า "ผม" มีครับ/ค่ะ ในการตอบ ให้ข้อมูลที่เป็นประโยชน์และตรงประเด็น ห้ามใช้คำหยาบหรือภาษารุนแรงเด็ดขาด'
          },
          ...conversationHistory
        ]
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    const data = await res.json();
    const reply = data.choices[0].message.content;

    typingBubble.classList.remove('typing');
    typingBubble.innerHTML = formatText(reply);
    chatWindow.scrollTop = chatWindow.scrollHeight;

    conversationHistory.push({ role: 'assistant', content: reply });

    // จำกัด history ไม่เกิน 20 ข้อความ (ป้องกัน context เกิน)
    if (conversationHistory.length > 20) {
      conversationHistory = conversationHistory.slice(-20);
    }

  } catch (e) {
    typingBubble.classList.remove('typing');
    typingBubble.textContent = `❌ เกิดข้อผิดพลาด: ${e.message}`;
    conversationHistory.pop(); // เอา user message ออกถ้า error
  }

  isLoading = false;
  sendBtn.disabled = false;
}
</script>
</body>
</html>
