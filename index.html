<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dakno AI — เหนือกว่า Claude ฟรี</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090f;
      --surface: #0c0f1a;
      --panel: #10141f;
      --card: #141824;
      --border: #1c2236;
      --accent: #4f8aff;
      --accent2: #7ba8ff;
      --glow: #4f8aff28;
      --text: #dde4f0;
      --muted: #4a5470;
      --muted2: #6b7894;
      --danger: #ff4f6a;
      --success: #2edd8c;
      --warn: #f5a623;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Sarabun', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-weight: 300;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 70% 50% at 10% -10%, #1a2a6022 0%, transparent 60%),
                  radial-gradient(ellipse 50% 40% at 90% 110%, #1a1a4015 0%, transparent 55%),
                  radial-gradient(ellipse 30% 30% at 50% 50%, #0d1428 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ====== FIX OUTLINE ====== */
    :focus:not(:focus-visible) {
      outline: none;
    }
    :focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--accent);
    }

    /* ====== HEADER (Scrollable) ====== */
    header {
      position: relative;
      z-index: 20;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(7, 9, 15, 0.92);
      backdrop-filter: blur(24px);
      flex-shrink: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      flex-wrap: nowrap;
    }
    header::-webkit-scrollbar { display: none; }
    .logo-wrap { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .logo-mark {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, #2451d4, #4f8aff);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      box-shadow: 0 0 18px #4f8aff44;
      flex-shrink: 0;
    }
    .logo-name { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 16px; color: white; }
    .logo-tag { font-size: 9px; color: var(--muted2); letter-spacing: 1.5px; font-family: 'JetBrains Mono', monospace; }
    .key-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    #api-key {
      width: 130px; padding: 7px 10px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); border-radius: 9px; font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
    }
    .hbtn {
      padding: 7px 11px; border-radius: 9px;
      border: 1px solid transparent; font-size: 11px;
      font-family: 'Sarabun', sans-serif; font-weight: 500;
      cursor: pointer; transition: all .2s; white-space: nowrap;
    }
    .hbtn.sec { background: var(--card); border-color: var(--border); color: var(--muted2); }
    .hbtn.sec:hover { border-color: var(--accent); color: var(--accent2); }
    .hbtn.pri { background: var(--accent); color: white; box-shadow: 0 2px 14px #4f8aff44; }

    /* Expert Strip */
    .expert-strip {
      position: relative; z-index: 15;
      display: flex; gap: 6px; padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto; background: var(--surface);
      flex-shrink: 0; scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .expert-strip::-webkit-scrollbar { display: none; }
    .expert-badge {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: 100px;
      border: 1px solid; font-size: 10.5px;
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap; cursor: pointer;
      transition: all .2s; opacity: 0.5;
    }
    .expert-badge.active { opacity: 1; }
    .badge-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .mode-toggle { margin-left: auto; flex-shrink: 0; display: flex; align-items: center; gap: 4px; }
    .mode-pill { padding: 4px 9px; border-radius: 100px; border: 1px solid var(--border); font-size: 10px; font-family: 'JetBrains Mono', monospace; color: var(--muted2); cursor: pointer; background: transparent; }
    .mode-pill.on { background: var(--accent); border-color: var(--accent); color: white; }
    #mode-manual { background: var(--card); border: 1px solid var(--border); color: var(--muted2); border-radius: 8px; font-size: 10px; font-family: 'JetBrains Mono', monospace; padding: 4px 6px; }

    /* Chat */
    #chat-window {
      position: relative; z-index: 1;
      flex: 1; overflow-y: auto; padding: 18px 14px 10px;
      display: flex; flex-direction: column; gap: 14px;
      scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
    }
    #chat-window::-webkit-scrollbar { width: 3px; }
    #chat-window::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    #welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 22px; text-align: center; }
    .w-icon { width: 60px; height: 60px; background: linear-gradient(135deg, #2451d4, #4f8aff); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 0 40px #4f8aff44; }
    #welcome h2 { font-family: 'Syne', sans-serif; font-size: 20px; }
    .experts-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; width: 100%; max-width: 380px; }
    .expert-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 11px 10px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 5px; }

    .msg-row { display: flex; gap: 9px; align-items: flex-end; animation: fadeUp .22s; }
    .msg-row.user { flex-direction: row-reverse; }
    .av { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    .av.ai { background: linear-gradient(135deg, #2451d4, #4f8aff); color: white; }
    .av.user { background: var(--card); border: 1px solid var(--border); color: var(--muted2); }
    .bubble { padding: 11px 15px; border-radius: 17px; max-width: 84%; font-size: 13.5px; line-height: 1.75; word-wrap: break-word; white-space: pre-wrap; }
    .bubble.user { background: linear-gradient(135deg, #1d42c4, #2d55e8); border-bottom-right-radius: 4px; }
    .bubble.ai { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .bubble-expert { display: inline-flex; align-items: center; gap: 4px; font-size: 9.5px; font-family: 'JetBrains Mono', monospace; padding: 2px 7px; border-radius: 100px; border: 1px solid; margin-bottom: 8px; }

    .typing-wrap { display: flex; gap: 5px; padding: 6px 4px; }
    .typing-wrap span { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; animation: tdot 1.2s infinite; opacity: .5; }
    @keyframes tdot { 40% { transform: translateY(-5px); opacity: 1; } }

    #status-bar { z-index: 10; font-size: 10.5px; font-family: 'JetBrains Mono', monospace; padding: 4px 18px; min-height: 22px; flex-shrink: 0; }
    .input-area { z-index: 10; padding: 10px 14px 14px; display: flex; gap: 8px; align-items: flex-end; border-top: 1px solid var(--border); background: rgba(7,9,15,.97); backdrop-filter: blur(20px); }
    #user-input { width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 11px 14px; border-radius: 13px; resize: none; font-size: 13.5px; font-family: 'Sarabun', sans-serif; min-height: 44px; max-height: 110px; line-height: 1.5; }
    .send-btn { width: 44px; height: 44px; background: linear-gradient(135deg, #1d42c4, #4f8aff); border-radius: 13px; border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .char-ct { font-size: 9.5px; color: var(--muted); text-align: right; padding: 3px; font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body>
  <header>
    <div class="logo-wrap">
      <div class="logo-mark">✦</div>
      <div>
        <div class="logo-name">Dakno AI</div>
        <div class="logo-tag">เหนือกว่า Claude · ฟรี</div>
      </div>
    </div>
    <div class="key-wrap">
      <input type="password" id="api-key" placeholder="Groq API Key" autocomplete="off">
      <button class="hbtn sec" id="btn-save">บันทึก</button>
      <button class="hbtn pri" id="btn-test">ทดสอบ</button>
    </div>
  </header>

  <div class="expert-strip" id="expert-strip"></div>
  <div id="chat-window">
    <div id="welcome">
      <div class="w-icon">✦</div>
      <h2>Dakno Multi‑Expert</h2>
      <p>12 AI ผู้เชี่ยวชาญ ฟรี ตอบลึก จดจำบริบท เลือกอัตโนมัติ</p>
      <div class="experts-grid" id="experts-grid"></div>
    </div>
  </div>
  <div id="status-bar"></div>
  <div class="input-area">
    <div class="input-wrap">
      <textarea id="user-input" placeholder="ถามอะไรก็ได้... (Enter เพื่อส่ง)" rows="1"></textarea>
      <div class="char-ct" id="char-ct">0 / 2000</div>
    </div>
    <button class="send-btn" id="send-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>

  <script>
    // ========== 12 EXPERTS ==========
    const EXPERTS = [
      { id:'general', model:'llama-3.3-70b-versatile', label:'General', icon:'🤖', color:'#4f8aff', sys:'คุณคือ Dakno ผู้ช่วยที่ตอบอย่างลึกซึ้งและมีประโยชน์มากกว่า Claude ตอบเป็นภาษาไทย ใช้คำสุภาพ ให้ข้อมูลถูกต้อง ละเอียด และมักถามกลับเพื่อให้ผู้ใช้ได้ประโยชน์สูงสุด' },
      { id:'reason', model:'deepseek-r1-distill-llama-70b', label:'Reasoning', icon:'🧠', color:'#a78bfa', sys:'คุณคือนักวิเคราะห์ระดับเทพ คิดเป็นขั้นตอนแบบ Chain-of-Thought ให้เหตุผลที่ชัดแจ้งกว่าคู่แข่ง ตอบภาษาไทย' },
      { id:'deepreason', model:'deepseek-r1-distill-qwen-32b', label:'Deep Reason', icon:'🔮', color:'#c084fc', sys:'คิดหลายชั้น วิเคราะห์เชิงลึกระดับปริญญาเอก ตอบภาษาไทย' },
      { id:'code', model:'qwen-2.5-coder-32b', label:'Code Pro', icon:'💻', color:'#2edd8c', sys:'คุณคือโปรแกรมเมอร์ที่เขียนโค้ดได้ดีกว่า Claude เน้น clean code และประสิทธิภาพ คอมเมนต์ไทย' },
      { id:'fast', model:'gemma2-9b-it', label:'Fast & Light', icon:'⚡', color:'#f5a623', sys:'ตอบสั้น ฉับไว แต่เปี่ยมคุณภาพ ภาษาไทย' },
      { id:'fastest', model:'llama-3.1-8b-instant', label:'Fastest', icon:'💨', color:'#f97316', sys:'ตอบทันที ไม่มีเกริ่น ภาษาไทย' },
      { id:'lang', model:'mistral-saba-24b', label:'Language Pro', icon:'🌐', color:'#f472b6', sys:'แปล เช็กแกรมมาร์ สรุปความ เรียงความได้ดีกว่า Claude ภาษาไทย' },
      { id:'deep', model:'qwq-32b', label:'Deep Think', icon:'🔬', color:'#38bdf8', sys:'วิทยาศาสตร์ คณิตศาสตร์ ใช้ first-principles thinking ตอบภาษาไทย' },
      { id:'math', model:'qwen-2.5-32b', label:'Math & Logic', icon:'📐', color:'#818cf8', sys:'แก้สมการ พิสูจน์ทฤษฎีบท แสดงวิธีทำอย่างอัจฉริยะ ภาษาไทย' },
      { id:'vision', model:'llama-3.2-11b-vision-preview', label:'Vision', icon:'🖼️', color:'#fb923c', sys:'บรรยายภาพที่ให้มาทาง URL ได้ละเอียดกว่า Claude ภาษาไทย' },
      { id:'creative', model:'llama-3.3-70b-versatile', label:'Creative', icon:'✍️', color:'#e879f9', sys:'นักเขียนมือรางวัล สร้างเรื่องสั้น นิยาย บทกวี เหนือชั้นกว่าคู่แข่ง' },
      { id:'thai', model:'llama-3.3-70b-versatile', label:'Thai Master', icon:'🇹🇭', color:'#34d399', sys:'ภาษาไทยขนานแท้ ใช้สำนวนสละสลวย คงภูมิปัญญาไทย' }
    ];

    let currentExpert = 'general';
    let currentMode = 'auto';
    let apiKey = localStorage.getItem('dakno_groq_key') || '';
    const MAX_CHARS = 2000;

    // Context memory (เก็บ 2 ข้อความล่าสุด)
    let conversationHistory = [];

    // Build UI
    function buildUI() {
      const strip = document.getElementById('expert-strip');
      const grid = document.getElementById('experts-grid');
      EXPERTS.forEach(ex => {
        const badge = document.createElement('div');
        badge.className = 'expert-badge';
        badge.dataset.id = ex.id;
        badge.style.color = ex.color;
        badge.style.borderColor = ex.color + '44';
        badge.innerHTML = `<div class="badge-dot" style="background:${ex.color}"></div>${ex.label}`;
        badge.onclick = () => setManual(ex.id);
        strip.appendChild(badge);

        const card = document.createElement('div');
        card.className = 'expert-card';
        card.style.borderLeft = `2px solid ${ex.color}`;
        card.innerHTML = `<span class="ec-icon">${ex.icon}</span><span class="ec-name">${ex.label}</span><span class="ec-desc">${ex.model.split('-')[0]}</span>`;
        card.onclick = () => hint(`(${ex.label}) `);
        grid.appendChild(card);
      });
      const toggle = document.createElement('div');
      toggle.className = 'mode-toggle';
      toggle.innerHTML = `<button class="mode-pill on" id="mode-auto">AUTO</button><select id="mode-manual"><option value="">เลือกเอง</option>${EXPERTS.map(e=>`<option value="${e.id}">${e.label}</option>`).join('')}</select>`;
      strip.appendChild(toggle);
    }
    buildUI();

    function setActiveBadge(id) {
      document.querySelectorAll('.expert-badge').forEach(b => b.classList.toggle('active', b.dataset.id===id));
    }
    function setMode(m) {
      currentMode = m;
      document.getElementById('mode-auto').classList.toggle('on', m==='auto');
      document.getElementById('mode-manual').value = '';
      updateStatus();
    }
    function setManual(id) {
      if (!id) return;
      currentMode = 'manual';
      currentExpert = id;
      document.getElementById('mode-auto').classList.remove('on');
      document.getElementById('mode-manual').value = id;
      setActiveBadge(id);
      updateStatus();
    }
    function updateStatus() {
      const bar = document.getElementById('status-bar');
      if (!apiKey) { bar.textContent = '⚡ ใส่ API Key'; bar.style.color='var(--muted)'; return; }
      const expert = EXPERTS.find(e=>e.id===currentExpert);
      bar.textContent = `🟢 ${currentMode==='auto'?'AUTO':expert.label} · ${expert.model}`;
      bar.style.color = 'var(--success)';
    }

    function routeExpert(msg) {
      const m = msg.toLowerCase();
      if (/โค้ด|code|function|debug|python|javascript|html|css|sql|react|node/.test(m)) return 'code';
      if (/วิเคราะห์|analysis|เหตุผล|เปรียบเทียบ|ตัดสินใจ|logic|reason/.test(m) && m.length>30) return 'reason';
      if (/พิสูจน์|คณิต|math|ฟิสิกส์|สมการ|คำนวณ|แคลคูลัส/.test(m)) return 'math';
      if (/แปล|translate|grammar|สรุป|ภาษา|ตรวจ/.test(m)) return 'lang';
      if (/รูป|ภาพ|image|photo|jpg|png|http/.test(m) && /https?:\/\/\S+\.(jpg|png|webp)/.test(m)) return 'vision';
      if (/เรื่องสั้น|นิยาย|บทกวี|creative|poem|แต่ง/.test(m)) return 'creative';
      if (/สั้น|เร็ว|ด่วน|what|when|อากาศ/.test(m) && m.length<40) return 'fast';
      if (/ไทย|ภาษาไทย|คำไทย|สำนวน/.test(m)) return 'thai';
      return 'general';
    }

    function hint(text) { document.getElementById('user-input').value = text; }

    // Chat functions with streaming
    function appendMessage(role, content, expertId=null) {
      const chat = document.getElementById('chat-window');
      const welcome = document.getElementById('welcome');
      if (welcome) welcome.remove();
      const row = document.createElement('div');
      row.className = 'msg-row '+role;
      const av = document.createElement('div');
      av.className = 'av '+role;
      av.textContent = role==='user' ? 'คุณ' : (EXPERTS.find(e=>e.id===expertId)?.icon||'✦');
      const bubble = document.createElement('div');
      bubble.className = 'bubble '+role;
      if (role==='ai' && expertId) {
        const ex = EXPERTS.find(e=>e.id===expertId);
        const label = document.createElement('div');
        label.className = 'bubble-expert';
        label.style.color=ex.color;
        label.style.borderColor=ex.color+'66';
        label.innerHTML = `<span style="background:${ex.color};width:6px;height:6px;border-radius:50%;display:inline-block;"></span> ${ex.label}`;
        bubble.appendChild(label);
      }
      bubble.appendChild(document.createTextNode(content));
      row.appendChild(av); row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return bubble; // return for streaming
    }

    async function handleSend() {
      const input = document.getElementById('user-input');
      const message = input.value.trim();
      if (!message || message.length>MAX_CHARS || !apiKey) return;
      input.value = '';
      document.getElementById('char-ct').textContent = '0/'+MAX_CHARS;
      appendMessage('user', message);
      conversationHistory.push({ role:'user', content: message });
      if (conversationHistory.length > 4) conversationHistory = conversationHistory.slice(-4);

      let expertId = currentMode==='manual' ? currentExpert : routeExpert(message);
      currentExpert = expertId;
      setActiveBadge(expertId);
      updateStatus();
      const expert = EXPERTS.find(e=>e.id===expertId);

      // Create AI bubble placeholder
      const chat = document.getElementById('chat-window');
      const row = document.createElement('div');
      row.className = 'msg-row ai';
      const av = document.createElement('div');
      av.className = 'av ai';
      av.textContent = expert.icon;
      const bubble = document.createElement('div');
      bubble.className = 'bubble ai';
      const label = document.createElement('div');
      label.className = 'bubble-expert';
      label.style.color=expert.color;
      label.style.borderColor=expert.color+'66';
      label.innerHTML = `<span style="background:${expert.color};width:6px;height:6px;border-radius:50%;display:inline-block;"></span> ${expert.label}`;
      bubble.appendChild(label);
      const contentSpan = document.createElement('span');
      bubble.appendChild(contentSpan);
      row.appendChild(av); row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;

      try {
        let messages = [{ role:'system', content: expert.sys }, ...conversationHistory];
        if (expertId==='vision') {
          const urlMatch = message.match(/https?:\/\/\S+\.(jpg|png|webp)/i);
          if (urlMatch) {
            messages = [{ role:'system', content: expert.sys },
              { role:'user', content: [{ type:'text', text: message.replace(urlMatch[0],'').trim()||'อธิบายภาพ' }, { type:'image_url', image_url:{ url:urlMatch[0] } }] }
            ];
          }
        }

        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method:'POST',
          headers: { 'Authorization':`Bearer ${apiKey}`, 'Content-Type':'application/json' },
          body: JSON.stringify({ model: expert.model, messages, temperature:0.7, max_tokens:2048, stream: true })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullText = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value);
          const lines = chunk.split('\n').filter(l => l.startsWith('data: '));
          for (const line of lines) {
            const json = line.slice(6);
                        if (json === '[DONE]') continue;
            try {
              const parsed = JSON.parse(json);
              const token = parsed.choices[0]?.delta?.content || '';
              fullText += token;
              contentSpan.textContent = fullText;
              chat.scrollTop = chat.scrollHeight;
            } catch(e) {}
          }
        }
        conversationHistory.push({ role: 'assistant', content: fullText });
      } catch (err) {
        contentSpan.textContent = '❌ ผิดพลาด: ' + err.message;
      }
    }

    // Event Listeners
    document.getElementById('send-btn').addEventListener('click', handleSend);
    document.getElementById('btn-save').addEventListener('click', () => {
      apiKey = document.getElementById('api-key').value.trim();
      localStorage.setItem('dakno_groq_key', apiKey);
      updateStatus();
    });
    document.getElementById('btn-test').addEventListener('click', async () => {
      const key = document.getElementById('api-key').value.trim();
      if (!key) return;
      const bar = document.getElementById('status-bar');
      bar.textContent = '⏳ ทดสอบ...';
      bar.style.color = 'var(--muted)';
      try {
        const r = await fetch('https://api.groq.com/openai/v1/models', {
          headers: { Authorization: `Bearer ${key}` }
        });
        if (r.ok) {
          apiKey = key;
          localStorage.setItem('dakno_groq_key', key);
          updateStatus();
        } else throw new Error('Key ไม่ถูกต้อง');
      } catch (e) {
        bar.textContent = '❌ ' + e.message;
        bar.style.color = 'var(--danger)';
      }
    });
    document.getElementById('mode-auto').addEventListener('click', () => setMode('auto'));
    document.getElementById('mode-manual').addEventListener('change', function() {
      setManual(this.value);
    });
    document.getElementById('user-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });
    document.getElementById('api-key').value = apiKey;
    setActiveBadge('general');
    updateStatus();
  </script>
</body>
</html>
