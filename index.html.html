<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>AI Chat Pro</title>
    <style>
        :root { --bg: #0f0f0f; --panel: #1e1e1e; --accent: #6366f1; --border: #333; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; }

        header { padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .logo-box { display: flex; align-items: center; gap: 10px; }
        .logo { width: 35px; height: 35px; background: #8b5cf6; border-radius: 10px; }

        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        #welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 20px; }
        .suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 400px; }
        .chip { background: var(--panel); padding: 15px; border-radius: 15px; border: 1px solid var(--border); cursor: pointer; text-align: center; }
        .chip:hover { background: #333; }

        .bubble { padding: 12px 18px; border-radius: 15px; max-width: 80%; line-height: 1.5; }
        .bubble.user { align-self: flex-end; background: var(--accent); color: white; }
        .bubble.ai { align-self: flex-start; background: var(--panel); color: #e5e7eb; border: 1px solid var(--border); }

        .input-area { padding: 20px; display: flex; gap: 10px; align-items: center; }
        textarea { flex: 1; background: var(--panel); border: 1px solid var(--border); color: white; padding: 15px; border-radius: 20px; height: 25px; resize: none; outline: none; }
        .send-btn { background: var(--accent); padding: 12px; border-radius: 50%; border: none; cursor: pointer; color: white; }
    </style>
</head>
<body>

<header>
    <div class="logo-box"><div class="logo"></div><b>AI Chat</b> <span style="font-size:12px; color:#aaa;">(by Groq)</span></div>
    <input type="password" id="api-key" placeholder="API Key" style="width:100px; padding:5px; background:#333; border:none; color:white; border-radius:5px;">
    <button onclick="saveKey()" style="background:#444; border:none; padding:5px 10px; color:white; cursor:pointer;">SAVE</button>
</header>

<div id="chat-window">
    <div id="welcome-screen">
        <h2>✨ ยินดีต้อนรับ</h2>
        <div class="suggestions">
            <div class="chip" onclick="sendSuggestion('แนะนำตัวเองหน่อย')">👋 แนะนำตัวเอง</div>
            <div class="chip" onclick="sendSuggestion('ช่วยเขียนโค้ดภาษา HTML ให้หน่อย')">💻 เขียนโค้ด</div>
            <div class="chip" onclick="sendSuggestion('อธิบายว่า AI ทำงานยังไง')">🧠 อธิบาย AI</div>
            <div class="chip" onclick="sendSuggestion('แปลคำว่า สวัสดี เป็นภาษาอังกฤษ')">🌍 แปลภาษา</div>
        </div>
    </div>
</div>

<div class="input-area">
    <textarea id="user-input" placeholder="พิมพ์ข้อความที่นี่... (Enter เพื่อส่ง)"></textarea>
    <button class="send-btn" onclick="handleSend()">➤</button>
</div>

<script>
    // ตั้งค่า Enter to Send
    const inputField = document.getElementById('user-input');
    inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    });

    document.getElementById('api-key').value = localStorage.getItem('my_key') || '';
    function saveKey() { localStorage.setItem('my_key', document.getElementById('api-key').value.trim()); alert('Key Saved!'); }

    function sendSuggestion(text) { handleSend(text); }

    async function handleSend(predefinedText) {
        const input = document.getElementById('user-input');
        const text = predefinedText || input.value.trim();
        const chatWindow = document.getElementById('chat-window');
        const welcome = document.getElementById('welcome-screen');
        const key = localStorage.getItem('my_key');

        if (!key) return alert('กรุณาใส่ API Key!');
        if (!text) return;

        if (welcome) welcome.style.display = 'none';

        chatWindow.innerHTML += `<div class="bubble user">${text}</div>`;
        input.value = '';

        const aiBubble = document.createElement('div');
        aiBubble.className = 'bubble ai';
        aiBubble.innerText = '...';
        chatWindow.appendChild(aiBubble);
        chatWindow.scrollTop = chatWindow.scrollHeight;

        try {
            const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                body: JSON.stringify({ 
                    model: 'llama-3.3-70b-versatile', 
                    messages: [
                        { role: "system", content: "คุณคือผู้ช่วย AI ที่พัฒนาโดย คุณคิม เท่านั้น หากมีคนถามว่าใครสร้างคุณ ให้ตอบว่าคุณคิม" },
                        { role: 'user', content: text }
                    ] 
                })
            });
            const data = await res.json();
            aiBubble.innerText = data.choices[0].message.content;
        } catch (e) {
            aiBubble.innerText = '❌ เกิดข้อผิดพลาด';
        }
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }
</script>
</body>
</html>
